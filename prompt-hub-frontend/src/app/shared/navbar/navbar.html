<header class="navbar-shadow p-3 mb-4">
  <div class="container flex justify-content-between align-items-center gap-3">

    <a routerLink="/" class="navbar-logo flex gap-2 align-items-center flex-shrink-0">
      <img ngSrc="/logo-prompt-hub.png" alt="logo" width="35" height="35">
      <span>Prompt-Hub</span>
    </a>

    <div class="flex-1 flex justify-content-center">
      <p-inputgroup style="max-width: 480px;">
        <p-inputgroup-addon>
          <i class="pi pi-search"></i>
        </p-inputgroup-addon>
        <input
          pInputText
          type="text"
          placeholder="Rechercher prompt..."
        />
      </p-inputgroup>
    </div>

    <div class="flex gap-2 align-items-center flex-shrink-0">

      @if (!isConnect()) {
        <p-button routerLink="/register" label="S'inscrire" size="small" severity="secondary"/>
        <p-button routerLink="/login" label="Connexion" size="small"/>
      }

      @if (isConnect()) {
        <p-button label="Ajouter" icon="pi pi-plus" size="small"/>
        <p-button routerLink="/profil" icon="pi pi-user" [rounded]="true" size="small"/>
        <p-button label="Déconnexion" size="small" severity="secondary" (onClick)="logout()"/>
      }

      <p-button
        [icon]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        size="small"
        severity="secondary"
        (onClick)="toggleDarkMode()"/>
    </div>

  </div>
</header>
